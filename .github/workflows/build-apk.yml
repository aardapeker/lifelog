# 📦 On every push to main: a signed Android App Bundle (AAB) for Google Play's Internal testing track
# (uploaded automatically once the PLAY_SERVICE_ACCOUNT_JSON secret exists) and/or an APK, attached
# to a GitHub Release. Which one: a "Build: apk", "Build: aab" or "Build: both" line in the pushed
# commit's message (no line = both), or the choice when started by hand (Actions → Run workflow). The APK is debug-signed like the old ones; the Play app is signed by Google:
# a phone uses one or the other.
# Secrets: UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS (the upload key),
#          PLAY_SERVICE_ACCOUNT_JSON (optional: automatic upload to Play).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      build:
        description: What to build
        type: choice
        options: [both, apk, aab]
        default: both

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }} # step "if"s can't read secrets directly
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history + tags: the release notes list everything since the last build

      - name: What to build
        id: what
        env:
          MSG: ${{ github.event.head_commit.message }}
          CHOICE: ${{ inputs.build }}
        run: |
          W="$CHOICE"
          [ -z "$W" ] && W=$(printf '%s\n' "$MSG" | grep -ioP '^build:\s*\K(apk|aab|both)' | tail -1 | tr 'A-Z' 'a-z')
          W=${W:-both}
          echo "Building: $W"
          echo "apk=$([ "$W" = apk ] || [ "$W" = both ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "aab=$([ "$W" = aab ] || [ "$W" = both ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        env:
          VERSION_CODE: ${{ github.run_number }} # every build gets a higher versionCode (Play needs it)
        run: npx expo prebuild --platform android --no-install

      - name: Upload key
        if: steps.what.outputs.aab == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::UPLOAD_KEYSTORE_B64 secret is missing (Play rejects debug-signed bundles)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore

      - name: Build release bundle (AAB)
        if: steps.what.outputs.aab == 'true'
        working-directory: android
        run: >
          ./gradlew bundleRelease --no-daemon
          -PLIFELOG_UPLOAD_STORE_FILE=upload.keystore
          -PLIFELOG_UPLOAD_STORE_PASSWORD='${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}'
          -PLIFELOG_UPLOAD_KEY_ALIAS='${{ secrets.UPLOAD_KEY_ALIAS }}'
          -PLIFELOG_UPLOAD_KEY_PASSWORD='${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}'

      # the APK as before, for installing from GitHub: debug-signed (no upload-key properties here), so it
      # updates an app installed from earlier APKs. It can't update the Play install (different key).
      - name: Build release APK (arm64)
        if: steps.what.outputs.apk == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename files
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BASE="lifelog-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          FILES=""
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "$BASE.aab"; FILES="$FILES $BASE.aab"
            echo "name=$BASE.aab" >> "$GITHUB_OUTPUT"
          fi
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "$BASE.apk"; FILES="$FILES $BASE.apk"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-build${{ github.run_number }}
          path: lifelog-v*-build${{ github.run_number }}.*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # every change since the previous build (its tag), one line each; the "Build: apk" markers left out
          PREV=$(git describe --tags --abbrev=0 --match 'v*-build*' HEAD^ 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log ${PREV:+"$PREV..HEAD"} ${PREV:--20} --no-merges --pretty='format:- %s%n' | grep -vE '^- Build: (apk|aab|both)$' | grep -v '^$'
            echo
            echo "Files: ${{ steps.apk.outputs.files }}"
          } > notes.md
          cat notes.md
          gh release create "v${{ steps.apk.outputs.version }}-build${GITHUB_RUN_NUMBER}" ${{ steps.apk.outputs.files }} \
            --title "Lifelog v${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file notes.md \
            --latest

      # after the GitHub release, so a Play problem (an expired key…) never holds back the APK
      - name: Send to Google Play (Internal testing)
        if: ${{ env.HAS_PLAY == 'true' && steps.what.outputs.aab == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.arda.lifelog
          releaseFiles: ${{ steps.apk.outputs.name }}
          track: internal
          status: completed
          releaseName: v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
