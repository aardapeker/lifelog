# 📦 On every push to main: a signed Android App Bundle (AAB) for Google Play's Internal testing track
# (uploaded automatically once the PLAY_SERVICE_ACCOUNT_JSON secret exists) and an APK, both attached
# to a GitHub Release. The APK is debug-signed like the old ones; the Play app is signed by Google:
# a phone uses one or the other.
# Secrets: UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS (the upload key),
#          PLAY_SERVICE_ACCOUNT_JSON (optional: automatic upload to Play).
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }} # step "if"s can't read secrets directly
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME)
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        env:
          VERSION_CODE: ${{ github.run_number }} # every build gets a higher versionCode (Play needs it)
        run: npx expo prebuild --platform android --no-install

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::UPLOAD_KEYSTORE_B64 secret is missing (Play rejects debug-signed bundles)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore

      - name: Build release bundle (AAB)
        working-directory: android
        run: >
          ./gradlew bundleRelease --no-daemon
          -PLIFELOG_UPLOAD_STORE_FILE=upload.keystore
          -PLIFELOG_UPLOAD_STORE_PASSWORD='${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}'
          -PLIFELOG_UPLOAD_KEY_ALIAS='${{ secrets.UPLOAD_KEY_ALIAS }}'
          -PLIFELOG_UPLOAD_KEY_PASSWORD='${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}'

      # the APK as before, for installing from GitHub: debug-signed (no upload-key properties here), so it
      # updates an app installed from earlier APKs. It can't update the Play install (different key).
      - name: Build release APK (arm64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename files
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BASE="lifelog-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/bundle/release/app-release.aab "$BASE.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$BASE.apk"
          echo "name=$BASE.aab" >> "$GITHUB_OUTPUT"
          echo "apk=$BASE.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lifelog-build${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.apk }}

      - name: Send to Google Play (Internal testing)
        if: ${{ env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.arda.lifelog
          releaseFiles: ${{ steps.apk.outputs.name }}
          track: internal
          status: completed
          releaseName: v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.apk.outputs.version }}-build${GITHUB_RUN_NUMBER}" "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.apk }}" \
            --title "Lifelog v${{ steps.apk.outputs.version }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
